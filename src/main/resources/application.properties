spring.application.name=swedbank-hometask

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:swedbank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Simulated external system called before every debit
external.logging.base-url=https://httpstat.us
external.logging.status-code=200
external.logging.timeout-ms=3000

# Fixed currency exchange rates (units of the currency per 1 EUR)
exchange.rates.EUR=1.0
exchange.rates.USD=1.09
exchange.rates.SEK=11.35
exchange.rates.GBP=0.85
